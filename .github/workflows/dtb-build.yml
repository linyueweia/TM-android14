name: dtb-build

on:
  workflow_dispatch:

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libssl-dev libelf-dev python3-dev
          gcc --version | head -1; dtc --version || true

      # NOTE: use `git -C sdk ...` everywhere. A `cd sdk` inside the loop leaks the
      # cwd for the rest of the step and made the `[ -d sdk/kernel-6.1 ]` check fail
      # even when the clone succeeded (run 41589698027 stopped at CLONE_FAILED after
      # CLONE_OK attempt=1).
      # The gitea -> Azure-runner path is the slow part (39-54 min, sometimes hangs
      # outright). Cache the sparse kernel tree so only the first run pays for it.
      - name: Restore SDK kernel tree from cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: rk35xx-a14-kernel6.1-v1

      - name: Partial clone SDK (kernel-6.1 only)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          URL=http://112.124.9.243:3000/friendlyelec/rk35xx-android14.git
          ok=0
          for i in 1 2 3 4 5; do
            rm -rf sdk
            if git clone --depth 1 --filter=blob:none --no-checkout "$URL" sdk \
               && git -C sdk sparse-checkout set --cone kernel-6.1 \
               && git -C sdk checkout -f; then
              ok=1; echo "CLONE_OK attempt=$i"; break
            fi
            echo "clone attempt $i failed, retry in 45s"
            rm -rf sdk
            sleep 45
          done
          [ "$ok" = "1" ] && [ -d sdk/kernel-6.1 ] || { echo CLONE_FAILED; exit 1; }
          du -sh sdk/.git sdk/kernel-6.1
          df -h /

      - name: Install T68M dts + register in Makefile
        run: |
          DDIR=sdk/kernel-6.1/arch/arm64/boot/dts/rockchip
          cp rk3568-lyt-t68m.dts "$DDIR/"
          python3 - <<'EOF'
          p = "sdk/kernel-6.1/arch/arm64/boot/dts/rockchip/Makefile"
          s = open(p).read()
          if "rk3568-lyt-t68m.dtb" in s:
              print("already registered"); raise SystemExit
          anchor = "rk3568-nanopi5-rev01.dtb"
          i = s.index(anchor)
          line_start = s.rfind("\n", 0, i) + 1
          ins = "\trk3568-lyt-t68m.dtb \\\n"
          s = s[:line_start] + ins + s[line_start:]
          open(p, "w").write(s)
          print("registered before:", anchor)
          EOF
          grep -n "lyt-t68m" "$DDIR/Makefile"

      - name: Locate android defconfig
        run: |
          cd sdk/kernel-6.1
          DC=$(find . -name 'nanopi5_android_defconfig' | head -1)
          if [ -z "$DC" ]; then DC=$(find . -name '*_android_defconfig' | grep -iE 'rk3568|nanopi5' | head -1); fi
          echo "found: $DC"
          [ -z "$DC" ] && { find . -name '*defconfig' | grep -i android | head; exit 1; }
          cp "$DC" arch/arm64/configs/t68m_android_defconfig
          make ARCH=arm64 t68m_android_defconfig

      - name: Build T68M dtb
        run: |
          # pipefail 必须有：`make ... | tee | tail` 只看 tail 的退出码，dts 语法
          # 错误时 make 已经失败而步骤仍显示 success —— 2026-11-04 就是这样假绿了
          # 一轮，artifact 里装的还是缓存里的旧 dtb（172,259 B）。
          set -euo pipefail
          cd sdk/kernel-6.1
          make ARCH=arm64 -j$(nproc) rockchip/rk3568-lyt-t68m.dtb 2>&1 | tee /tmp/dtb_build.log | tail -30
          D=arch/arm64/boot/dts/rockchip/rk3568-lyt-t68m.dtb
          test -s "$D"
          sz=$(stat -c %s "$D"); echo "dtb size=$sz"
          [ "$sz" -gt 170000 ] || { echo "FATAL: dtb 只有 $sz B，明显没真编译"; exit 1; }
          ls -l "$D"

      - name: Evidence
        run: |
          D=sdk/kernel-6.1/arch/arm64/boot/dts/rockchip/rk3568-lyt-t68m.dtb
          {
            echo "## dtb build"
            echo '```'
            ls -l "$D"
            file "$D"
            dtc -I dtb -O dts "$D" 2>/dev/null | head -40
            echo '```'
            echo "## SoC IP enable matrix (board vs vendor rk3568-nanopi5-rev01)"
            echo '```'
            python3 tools/dtb_features.py "$D" --base dist/rk3568-nanopi5-rev01-base.dtb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail loudly if a feature the vendor board has enabled is off here.
      # NPU/VPU/RGA/JPEG/OP-TEE/CMA being disabled is silent at boot and only
      # shows up later as "rknn won't init" or "gralloc allocation failed".
      - name: Assert feature parity
        run: |
          set -euo pipefail
          D=sdk/kernel-6.1/arch/arm64/boot/dts/rockchip/rk3568-lyt-t68m.dtb
          test -s "$D" || { echo "FATAL: dtb 不存在，上一构建步骤其实失败了"; exit 1; }
          python3 tools/dtb_features.py "$D" --base dist/rk3568-nanopi5-rev01-base.dtb             | grep -E '^(NPU|GPU|VPU-dec|VPU-enc|RGA|OP-TEE|CMA) ' | tee /tmp/features.txt
          grep -q 'NPU .*<<< DIFF' /tmp/features.txt && { echo "NPU still disabled"; exit 1; } || true
          grep -q 'GPU .*<<< DIFF' /tmp/features.txt && { echo "GPU disabled"; exit 1; } || true
          grep -q 'VPU-dec .*<<< DIFF' /tmp/features.txt && { echo "VPU-dec disabled"; exit 1; } || true
          # 三个 IP 级开关必须和 R5S 基线一致（crypto / dfi / 休眠框架）
          # 不要在这里用 heredoc：块标量里结束符若顶格会直接把 YAML 截断
          # （2026-11-04 踩过，workflow 变成 "does not have workflow_dispatch trigger"）。
          for n in crypto@fe380000 dfi@fe230000 rockchip-suspend; do
            python3 -c "import sys;sys.path.insert(0,'tools');import dtb_diff as D;N,_=D.load('$D');v=N.get('/'+'$n',{}).get('status',b'<absent>');print('status($n) =', v.rstrip(b'\0').decode())"
          done
          python3 tools/dtb_diff.py "$D" dist/rk3568-lyt-t68m-android.dtb --only-ip > /tmp/ipdiff.txt
          head -3 /tmp/ipdiff.txt
          if grep -qE '语义差异（[1-9][0-9]*）' /tmp/ipdiff.txt; then
            echo "WARN: 源码编译产物与 dist 存在 IP 差异（下面列全）"; cat /tmp/ipdiff.txt
          fi
          echo "feature parity OK"
          mkdir -p out
          cp "$D" out/
          cp /tmp/dtb_build.log out/ 2>/dev/null || true
          tar -czf out.tgz out

      - name: Upload dtb
        uses: actions/upload-artifact@v4
        with:
          name: t68m-dtb
          path: out.tgz
          retention-days: 7
