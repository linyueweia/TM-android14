name: build-t68m-usb

# USB 线刷包（Maskrom + RKDevTool / rkdeveloptool）
#   1. update.img.zst   —— Rockchip RKAF 容器（afptool + rkImageMaker 打包）再 zstd 压，
#                          RKDevTool 一键刷；下载后要先 `zstd -d` 还原成 update.img
#   2. partitions.zip   —— parameter.txt + MiniLoaderAll.bin + 各分区 img，用「分区烧写」兜底
# 默认只出第 1 个（约 815 MB）。第 2 个和 update.img 内容重复、约 1 GB，
# 只有 dispatch 时把 with_partitions 设成 true 才产出（打包失败时兜底用）。
on:
  workflow_dispatch:
    inputs:
      src_url:
        description: android-14 partition bundle
        required: false
        default: https://downloads.friendlyelec.com/os-images/rk3568/images/android-14-images-20251222.tgz
      dtb:
        description: dtb to inject
        required: false
        default: dist/rk3568-lyt-t68m-android.dtb
      release_tag:
        description: 可选：填了就同时发布到 Release（如 v1.0.0），留空只出 artifact
        required: false
        default: ""
      with_partitions:
        description: 额外产出分区包 partitions.zip（约 1 GB，与 update.img 内容重复，仅打包失败兜底时需要）
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 zip unzip file zstd
          df -h /

      - name: Fetch bundle
        run: |
          set -eux
          for i in 1 2 3 4 5; do
            curl -L --fail --connect-timeout 20 --max-time 3600 \
                 --retry 5 --retry-delay 10 --retry-all-errors \
                 -o images.tgz "${{ github.event.inputs.src_url }}" && break
            sleep 15
          done
          ls -l images.tgz; sha256sum images.tgz
          mkdir -p parts && tar xzf images.tgz -C parts
          find parts -maxdepth 2 -type f -printf '%10s %p\n' | sort -k2 | head -25

      - name: Inject T68M dtb into boot.img
        run: |
          set -eux
          mkdir -p usb
          D=usb
          DTB="${{ github.event.inputs.dtb }}"
          python3 tools/dtb_features.py "$DTB" --base dist/rk3568-lyt-t68m-vendor.dtb | tee /tmp/feat.txt
          # NPU stays ENABLED, same as the vendor image for this board (LYT T68M rev0f). The 7.6 s panic
          # ("failed to get ack on domain 'npu'") was never a reason to disable it: this DTS
          # was missing vdd_npu(DCDC_REG4) regulator-always-on / -boot-on / -init-microvolt,
          # which the R5S baseline dtb has, so the NPU domain was unpowered when its iommu
          # attached to it at 7.6 s and the PMU idle-request never got its ack.
          npu_row=$(grep -E '^NPU[[:space:]]' /tmp/feat.txt || true)
          echo "gate: $npu_row"
          case "$npu_row" in
            *fail*) echo "FATAL: NPU must stay enabled (vendor parity); if it panics with"
                    echo "       'failed to get ack on domain npu', vdd_npu lost always-on"
                    exit 1 ;;
            *) echo "OK: NPU enabled, matching vendor (LYT T68M rev0f)" ;;
          esac
          # Patches that are only visible in the dtb bytes, not in the feature matrix.
          for s in 'rockchip,plane-mask' 'rockchip,primary-plane' 'regulator-always-on' 'no-1-8-v'; do
            grep -q -- "$s" "$DTB" || { echo "FATAL: dtb missing patch: $s"; exit 1; }
          done
          if grep -q -- 'sd-uhs-sdr50' "$DTB"; then
            echo "FATAL: sd-uhs-sdr50 still present (system disk must stay 3.3V)"; exit 1
          fi
          echo "gate: dtb patches OK (npu/iommu fail, vop plane-mask, always-on, no-1-8-v)"
          # HDMI 音频必须是最新 dtb。mclk-fs 不是 128（dtsi 默认 256）或声卡名不是
          # rockchip,hdmi0 时，固件上板就是「有画面没声音」，而且内核日志零报错 ——
          # 这类缺陷只能靠构建时拦住，不能等上板放音乐才发现。
          python3 -c "
          import sys; sys.path.insert(0,'tools'); import dtb_diff as D
          N,_=D.load('$DTB'); h=N.get('/hdmi-sound') or {}
          m=h.get('simple-audio-card,mclk-fs')
          n=(h.get('simple-audio-card,name') or b'').rstrip(b'\x00')
          assert m==b'\x00\x00\x00\x80', 'mclk-fs=%r, need 128 -- dtb is stale' % (m,)
          assert n==b'rockchip,hdmi0', 'card name=%r, need rockchip,hdmi0 -- dtb is stale' % (n,)
          print('gate: HDMI audio OK (mclk-fs=128, name=rockchip,hdmi0)')
          "

          pick() { find parts -name "$1" -type f | head -1; }
          src=$(pick boot.img); [ -n "$src" ] || { echo "no boot.img"; exit 1; }
          cp "$src" "$D/boot.orig.img"
          # 同 SD/eflasher：必须走 make_lite_boot.py，boot-replace 会按 47 条目布局，
          # 单槽 172,544 B 装不下 172,602 B 的 dtb。
          python3 tools/make_lite_boot.py "$D/boot.orig.img" "$DTB" "$D/boot.img" | tee /tmp/lite.txt
          grep -q 'entries=18' /tmp/lite.txt
          # 槽 size 恒等于 dtb 大小（build_rcs 按实际长度重排），没有固定容量可言，
          # 所以这里只校验布局真的算出来了，不再断言 headroom。
          grep -qE 'board slot\(s\), [0-9]+ B each' /tmp/lite.txt
          python3 tools/rsce_tool.py boot-list "$D/boot.img" | tee /tmp/list.txt | grep -E 'entries=|rk3568' | head -8
          grep -q 'rev0f\.dtb' /tmp/list.txt || { echo "FATAL: no rev0f slot (board is hwrev 0x0f)"; exit 1; }
          # 产物级校验：以上只证明输入 dtb 是对的，这里证明它**真的被写进了 boot.img**。
          # 逐字节查这份 dtb 是否完整出现在产物里，缺一个字节都算没注入。
          python3 -c "
          d=open('$D/boot.img','rb').read(); b=open('$DTB','rb').read()
          assert b in d, 'FATAL: boot.img 里找不到这份 dtb 的字节，注入没生效'
          print('gate: dtb in boot.img OK (%d B at offset %d)' % (len(b), d.index(b)))
          "

          # A silently skipped file turns into a broken package 3 steps later (empty
          # parameter.txt -> BK='' -> the && chain returns 1 -> confusing "exit code 1").
          # Collect the misses and fail here, where the reason is obvious.
          missing=""
          for f in parameter.txt MiniLoaderAll.bin uboot.img misc.img dtbo.img vbmeta.img \
                   super.img baseparameter.img; do
            s=$(pick "$f" || true)
            if [ -n "$s" ]; then cp "$s" "$D/$f"; else echo "MISSING $f"; missing="$missing $f"; fi
          done
          ls -l "$D"
          if [ -n "$missing" ]; then echo "bundle did not provide:$missing"; exit 1; fi


      - name: Serial console on ttyS2 (this board's DTB has no fiq-debugger)
        run: |
          set -euxo pipefail
          D=usb
          # The board DTS is a Linux one: uart2 (0xfe660000) is driven by 8250 and
          # /chosen/stdout-path = "serial2:1500000n8" -- that is the console proven on this
          # board (COM3 @ 1500000).  There is no /fiq-debugger node, so the vendor's
          # "console=ttyFIQ0" has no driver: after earlycon the kernel prints nowhere and the
          # board looks dead while it boots.  Point the cmdline at ttyS2 instead.
          python3 tools/boot_cmdline.py show "$D/boot.img" || true
          python3 tools/boot_cmdline.py set "$D/boot.img" -o "$D/boot.cmd.img" --console ttyS2,1500000
          mv "$D/boot.cmd.img" "$D/boot.img"
          python3 tools/boot_cmdline.py show "$D/boot.img" | grep -q 'console=ttyS2,1500000'

      - name: Fix boot header SHA1 (u-boot CONFIG_ANDROID_BOOT_IMAGE_HASH)
        run: |
          set -euxo pipefail
          D=usb
          # DTB swap changed the hashed content -> header id[20]@0x240 is stale -> u-boot
          # stops with "Failed to load android image". Not AVB (empty vbmeta, flags=0x2).
          python3 tools/rk_boot_id.py check "$D/boot.img" || true
          python3 tools/rk_boot_id.py fix "$D/boot.img" -o "$D/boot.img.new"
          mv "$D/boot.img.new" "$D/boot.img"
          python3 tools/rk_boot_id.py check "$D/boot.img" | tee /tmp/bootid.txt
          grep -q MATCH /tmp/bootid.txt
      - name: Build update.img (Rockchip RKAF)
        run: |
          set -euxo pipefail
          cd usb
          # afptool / rkImageMaker 不在 rkbin 里（那仓只有固件 bin），在 RKTools 里
          rm -rf /tmp/rktools
          git clone --depth 1 --filter=blob:none --sparse https://github.com/rockchip-toybrick/RKTools.git /tmp/rktools
          git -C /tmp/rktools sparse-checkout set linux/Linux_Pack_Firmware/rockdev
          TOOLS=/tmp/rktools/linux/Linux_Pack_Firmware/rockdev
          ls -l "$TOOLS"
          chmod +x "$TOOLS"/afptool "$TOOLS"/rkImageMaker
          file "$TOOLS"/afptool "$TOOLS"/rkImageMaker || true
          "$TOOLS/afptool" --help 2>&1 | head -5 || true

          # rkImageMaker -os_type:androidos 强制要求 backup 分区（"No found backup partition!"），
          # 友善的分区包不带 backup.img -> 按 parameter.txt 里的扇区数造一个零文件
          # `set -e` aborts on the ASSIGNMENT itself if sed cannot read the file, which
          # surfaces as a bare "exit code 1" with no message.  Guard it explicitly.
          [ -f parameter.txt ] || { echo "parameter.txt missing from the package dir"; ls -l; exit 1; }
          BK=$(sed -n 's/.*CMDLINE:[^:]*://p' parameter.txt | tr ',' '\n' | grep -oE '0x[0-9a-f]+@0x[0-9a-f]+\(backup\)' | cut -d'@' -f1 | head -1) || true
          if [ -z "$BK" ]; then
            echo "parameter.txt has no backup partition; rkImageMaker -os_type:androidos will refuse"
            sed -n 's/.*CMDLINE:[^:]*://p' parameter.txt | head -2
            exit 1
          fi
          if [ ! -f backup.img ]; then
            truncate -s $(( BK * 512 )) backup.img
            echo "created backup.img $(( BK * 512 )) bytes (from parameter.txt)"
          fi

          # package-file：官方格式只有两列 NAME<TAB>path（第一行是 package-file 自身），
          # 写三列会把第三列当路径 -> afptool 报 <AddFile> err=2。A/B 槽映射到无后缀的 img。
          PARTS=$(sed -n 's/.*CMDLINE:[^:]*://p' parameter.txt | tr ',' '\n' | sed -n 's/.*(\([a-z0-9_]*\).*/\1/p' | sed 's/:.*//')
          echo "$PARTS"
          {
            printf '# NAME\tpath\n'
            printf 'package-file\tpackage-file\n'
            printf 'bootloader\tMiniLoaderAll.bin\n'
            printf 'parameter\tparameter.txt\n'
            for p in $PARTS; do
              case "$p" in *_b) continue ;; esac
              base=${p%_a}
              if [ -f "$p.img" ]; then f="$p.img"
              elif [ -f "$base.img" ]; then f="$base.img"
              else continue; fi
              printf '%s\t%s\n' "$p" "$f"
            done
          } > package-file
          cat -A package-file | head -20

          "$TOOLS/afptool" -pack ./ update.raw.img
          # TAG 从 MiniLoaderAll.bin 偏移 21 读 4 字节（如 3568 -> RK3568），不能写死
          TAG=RK$(hexdump -s 21 -n 4 -e '4 "%c"' MiniLoaderAll.bin | rev)
          echo "TAG=$TAG"
          "$TOOLS/rkImageMaker" -${TAG} MiniLoaderAll.bin update.raw.img update.img -os_type:androidos
          rm -f update.raw.img package-file
          ls -l update.img
          sha256sum update.img

      - name: Compress update.img (zstd, 4.3G -> 约 1/3)
        if: always()
        run: |
          set -euxo pipefail
          # update.img 是 RKAF 裸容器：分区镜像按扇区原样拼进去，里面大量零填充，
          # 而 artifact 又是 compression-level: 0（Stored，不压），所以下载要 4.3 GB。
          # zstd 对这种数据压得动，解压几秒。Windows 用 7-Zip >= 24 或 `zstd -d`。
          if [ ! -f usb/update.img ]; then
            echo "update.img missing (packaging failed?) -- skip compression"
            exit 0
          fi
          RAW=$(stat -c%s usb/update.img)
          # -19 在 2.4 GB 上约 2~4 分钟（4 vCPU）；想更快改 -12，体积约多 3~5%
          zstd -T0 -19 -q -f usb/update.img -o usb/update.img.zst
          ZST=$(stat -c%s usb/update.img.zst)
          RATIO=$(awk -v a="$ZST" -v b="$RAW" 'BEGIN{printf "%.1f", a*100/b}')
          echo "update.img: $RAW B -> update.img.zst: $ZST B (${RATIO}%)"
          # 记相对文件名，下载后 `sha256sum -c update.img.zst.sha256` 才能直接校验
          ( cd usb && sha256sum update.img.zst > update.img.zst.sha256 && cat update.img.zst.sha256 )
          echo "ZST_BYTES=$ZST" >> "$GITHUB_ENV"
          echo "RAW_BYTES=$RAW" >> "$GITHUB_ENV"
          echo "ZST_RATIO=$RATIO" >> "$GITHUB_ENV"

      - name: Pack partitions zip (optional)
        if: always() && github.event.inputs.with_partitions == 'true'
        run: |
          set -euxo pipefail
          cd usb
          cp ../docs/usb-flash-readme.txt 说明.txt
          # 必须把容器本体排除掉：以前只排了 update.raw.img，2.38 GB 的 update.img 被
          # 一起塞进 zip，等于同一份镜像在 artifact 里存了两遍（4.3 GB 的来源）。
          zip -r ../t68m-android14-usb-partitions.zip . \
              -x 'update.raw.img' 'update.img' 'update.img.zst' 'update.img.zst.sha256'
          ls -l ../t68m-android14-usb-partitions.zip

      - name: Evidence
        if: always()
        run: |
          {
            echo "## T68M USB flash package"
            echo '```'
            ls -l usb/ 2>/dev/null || true
            ls -l t68m-android14-usb-partitions.zip 2>/dev/null || true
            if [ -n "${ZST_BYTES:-}" ]; then
              printf 'update.img %s B -> .zst %s B (%s%%)\n' "${RAW_BYTES}" "${ZST_BYTES}" "${ZST_RATIO}"
            fi
            echo '--- dtb feature matrix ---'
            cat /tmp/feat.txt 2>/dev/null || true
            echo '```'
            echo
            if [ -f t68m-android14-usb-partitions.zip ]; then
              echo "分区包：已产出（with_partitions=true）"
            else
              echo "分区包：未产出（with_partitions 未开启，默认只出压缩后的 update.img）"
            fi
            echo
            echo "**下载后**：\`zstd -d update.img.zst\`（Windows 用 7-Zip >= 24 右键解压）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t68m-android14-usb
          path: |
            usb/update.img.zst
            usb/update.img.zst.sha256
            t68m-android14-usb-partitions.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

      - name: Publish to Release (optional)
        if: always() && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: T68M Android 14 ${{ github.event.inputs.release_tag }}
          body: |
            T68M（RK3568）Android 14 线刷包。

            - `update.img.zst` —— RKDevTool 一键刷；先 `zstd -d` 解出 `update.img`（Windows 用 7-Zip ≥ 24）
            - `t68m-android14-usb-partitions.zip` —— 分区烧写兜底（含 `说明.txt` 与 `parameter.txt`）
          files: |
            usb/update.img.zst
            usb/update.img.zst.sha256
            t68m-android14-usb-partitions.zip
          fail_on_unmatched_files: false
