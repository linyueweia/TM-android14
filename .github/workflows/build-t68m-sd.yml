name: build-t68m-sd

# Assemble a bootable SD image for LYT T68M out of FriendlyElec's rk3568 Android 14
# partition bundle, entirely on the runner, and publish it as a downloadable artifact.
#
# Why on the runner: downloads.friendlyelec.com ignores Range requests (a ranged GET
# comes back as HTTP 200 streaming the whole file), so an interrupted home download can
# never resume. The runner's uplink is stable, and artifacts come back over GitHub's CDN.
#
# What it does:
#   1. fetch android-14-images-<date>.tgz and unpack the partition images
#   2. take boot.img and swap the RSCE dtb slots for the T68M dtb in dist/
#      (16 rk3568-nanopi5-rev0X slots -> one T68M tree, so any hwrev probe matches)
#   3. assemble the SD image with FriendlyElec's own sd-fuse_rk3568 mk-sd-image.sh
#   4. gzip it and upload
on:
  workflow_dispatch:
    inputs:
      src_url:
        description: partition bundle url
        required: false
        default: https://downloads.friendlyelec.com/os-images/rk3568/images/android-14-images-20251222.tgz
      dtb:
        description: dtb to inject (repo-relative)
        required: false
        default: dist/rk3568-lyt-t68m-android.dtb
      raw_size_mb:
        description: SD image raw size in MiB
        required: false
        default: "7800"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex gzip pigz python3 parted dosfstools mtools \
            exfatprogs e2fsprogs android-sdk-libsparse-utils || true
          # ubuntu 24.04+/26.04 dropped android-tools-fsutils; android-sdk-libsparse-utils
          # provides simg2img instead, which sd-fuse's util.sh probes for.
          command -v simg2img && simg2img --help 2>&1 | head -2 || echo "simg2img missing"
          command -v mkfs.exfat || echo "mkfs.exfat missing"

      - name: Fetch partition bundle
        run: |
          URL="${{ github.event.inputs.src_url }}"
          echo "url: $URL"
          for i in 1 2 3 4 5; do
            if curl -L --fail --connect-timeout 20 --max-time 3600 \
                    --retry 5 --retry-delay 10 --retry-all-errors \
                    -o images.tgz "$URL"; then
              echo "downloaded on attempt $i"; break
            fi
            echo "attempt $i failed, retrying"; sleep 20
          done
          ls -l images.tgz
          sha256sum images.tgz

      - name: Unpack and inventory
        run: |
          mkdir -p parts
          tar xzf images.tgz -C parts
          echo "### bundle contents" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find parts -maxdepth 2 -type f -printf '%10s  %p\n' | sort -k2 | head -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find parts -maxdepth 2 -type f -printf '%10s  %p\n' | sort -k2 | head -40

      - name: Clone sd-fuse
        run: |
          set -eux
          git clone --depth 1 https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse
          # FriendlyElec's util.sh still asks for android-tools-fsutils, which no longer
          # exists on ubuntu 24.04+ ("has no installation candidate" -> the whole
          # mk-sd-image.sh dies on set -e). If simg2img is already present the probe is
          # skipped, but patch the name anyway so a missing package can't kill the build.
          if ! command -v simg2img >/dev/null; then
            sed -i 's/android-tools-fsutils/android-sdk-libsparse-utils/' sd-fuse/tools/util.sh
          fi
          grep -n "PACKAGES=" sd-fuse/tools/util.sh | head -5

      - name: Stage partition files
        run: |
          set -eux
          D=sd-fuse/android14
          mkdir -p "$D"
          pick() { find parts -name "$1" -type f | head -1; }

          # files that must come from the bundle
          for f in parameter.txt config.cfg MiniLoaderAll.bin uboot.img dtbo.img \
                   vbmeta.img misc.img pcba_small_misc.img pcba_whole_misc.img \
                   baseparameter.img super.img; do
            src=$(pick "$f" || true)
            if [ -n "$src" ]; then cp "$src" "$D/$f"; echo "from bundle: $f"; else echo "MISSING: $f"; fi
          done

          # idbloader / misc / dtbo can fall back to sd-fuse prebuilt
          for f in idbloader.img MiniLoaderAll.bin misc.img dtbo.img; do
            [ -f "$D/$f" ] || { cp "sd-fuse/prebuilt/$f" "$D/$f"; echo "from prebuilt: $f"; }
          done
          [ -f "$D/parameter.txt" ] || cp sd-fuse/prebuilt/parameter.template "$D/parameter.txt"

          # keep the pristine boot.img for reference, then patch ours in
          src=$(pick boot.img || true)
          [ -n "$src" ] || { echo "no boot.img in bundle"; exit 1; }
          cp "$src" "$D/boot.orig.img"
          ls -l "$D" | head -30

      - name: Self-test the boot hash fixer (synthetic fixture, no download)
        run: |
          set -euxo pipefail
          python3 tools/test_rk_boot_id.py
          python3 tools/rehearse_boot_pipeline.py

      - name: Inject T68M dtb into boot.img
        run: |
          set -eux
          D=sd-fuse/android14
          DTB="${{ github.event.inputs.dtb }}"
          test -f "$DTB"
          python3 tools/dtb_features.py "$DTB" --base dist/rk3568-lyt-t68m-vendor.dtb | tee /tmp/feat.txt
          # NPU stays ENABLED, same as the vendor image for this board (LYT T68M rev0f). The 7.6 s panic
          # ("failed to get ack on domain 'npu'") was never a reason to disable it: this DTS
          # was missing vdd_npu(DCDC_REG4) regulator-always-on / -boot-on / -init-microvolt,
          # which the R5S baseline dtb has, so the NPU domain was unpowered when its iommu
          # attached to it at 7.6 s and the PMU idle-request never got its ack.
          npu_row=$(grep -E '^NPU[[:space:]]' /tmp/feat.txt || true)
          echo "gate: $npu_row"
          case "$npu_row" in
            *fail*) echo "FATAL: NPU must stay enabled (vendor parity); if it panics with"
                    echo "       'failed to get ack on domain npu', vdd_npu lost always-on"
                    exit 1 ;;
            *) echo "OK: NPU enabled, matching vendor (LYT T68M rev0f)" ;;
          esac
          # Patches that are only visible in the dtb bytes, not in the feature matrix.
          for s in 'rockchip,plane-mask' 'rockchip,primary-plane' 'regulator-always-on' 'no-1-8-v'; do
            grep -q -- "$s" "$DTB" || { echo "FATAL: dtb missing patch: $s"; exit 1; }
          done
          if grep -q -- 'sd-uhs-sdr50' "$DTB"; then
            echo "FATAL: sd-uhs-sdr50 still present (system disk must stay 3.3V)"; exit 1
          fi
          echo "gate: dtb patches OK (npu/iommu fail, vop plane-mask, always-on, no-1-8-v)"
          # HDMI 音频必须是最新 dtb。mclk-fs 不是 128（dtsi 默认 256）或声卡名不是
          # rockchip,hdmi0 时，固件上板就是「有画面没声音」，而且内核日志零报错。
          python3 -c "
          import sys; sys.path.insert(0,'tools'); import dtb_diff as D
          N,_=D.load('$DTB'); h=N.get('/hdmi-sound') or {}
          m=h.get('simple-audio-card,mclk-fs')
          n=(h.get('simple-audio-card,name') or b'').rstrip(b'\x00')
          assert m==b'\x00\x00\x00\x80', 'mclk-fs=%r, need 128 -- dtb is stale' % (m,)
          assert n==b'rockchip,hdmi0', 'card name=%r, need rockchip,hdmi0 -- dtb is stale' % (n,)
          print('gate: HDMI audio OK (mclk-fs=128, name=rockchip,hdmi0)')
          "

          # 用 make_lite_boot.py，不用 boot-replace。后者保留全部 47 个条目（含
          # rk3399/rk3566/rk3576/rk3588 的 29 个死 blob，6.34 MB），单槽容量只有
          # 172,544 B —— 本版 dtb 已经 172,602 B（NPU 三个属性 + vop plane-mask）。
          # 精简到 16 个 T68M 槽 + 2 个 logo 后，末槽容量 = second_size - 末槽偏移，
          # 与实机验证过的 board/boot_align.img 走同一条构建路径。
          python3 tools/make_lite_boot.py "$D/boot.orig.img" "$DTB" "$D/boot.img" | tee /tmp/lite.txt
          grep -q 'entries=18' /tmp/lite.txt
          # 槽 size 恒等于 dtb 大小（build_rcs 按实际长度重排），没有固定容量可言，
          # 所以这里只校验布局真的算出来了，不再断言 headroom。
          grep -qE 'board slot\(s\), [0-9]+ B each' /tmp/lite.txt
          python3 tools/rsce_tool.py boot-list "$D/boot.img" | tee /tmp/list.txt | grep -E 'entries=|rk3568' | head -20
          # 本板 hwrev=0x0f，u-boot 按名字选 rk3568-nanopi5-rev0f.dtb。SD 包里的
          # boot.img 只有 rev01..rev07（37 条目版），make_lite_boot 的 --fill-revs 0-15
          # 会把缺的补齐；没有 rev0f 槽的镜像上板必找不到 dtb。
          grep -q 'rev0f\.dtb' /tmp/list.txt || { echo "FATAL: no rev0f slot (board is hwrev 0x0f)"; exit 1; }
          # 产物级校验：以上只证明输入 dtb 是对的，这里证明它**真的被写进了 boot.img**。
          # 逐字节查这份 dtb 是否完整出现在产物里，缺一个字节都算没注入。
          python3 -c "
          d=open('$D/boot.img','rb').read(); b=open('$DTB','rb').read()
          assert b in d, 'FATAL: boot.img 里找不到这份 dtb 的字节，注入没生效'
          print('gate: dtb in boot.img OK (%d B at offset %d)' % (len(b), d.index(b)))
          "

      - name: Serial console on ttyS2 (this board's DTB has no fiq-debugger)
        run: |
          set -euxo pipefail
          D=sd-fuse/android14
          # The board DTS is a Linux one: uart2 (0xfe660000) is driven by 8250 and
          # /chosen/stdout-path = "serial2:1500000n8" -- that is the console proven on this
          # board (COM3 @ 1500000).  There is no /fiq-debugger node, so the vendor's
          # "console=ttyFIQ0" has no driver: after earlycon the kernel prints nowhere and the
          # board looks dead while it boots.  Point the cmdline at ttyS2 instead.
          python3 tools/boot_cmdline.py show "$D/boot.img" || true
          python3 tools/boot_cmdline.py set "$D/boot.img" -o "$D/boot.cmd.img" --console ttyS2,1500000
          mv "$D/boot.cmd.img" "$D/boot.img"
          python3 tools/boot_cmdline.py show "$D/boot.img" | grep -q 'console=ttyS2,1500000'

      - name: Fix boot header SHA1 (u-boot CONFIG_ANDROID_BOOT_IMAGE_HASH)
        run: |
          set -euxo pipefail
          D=sd-fuse/android14
          # Swapping the DTB inside the RSCE second stage changed the hashed content, so the
          # 20-byte digest at header offset 0x240 is now stale. u-boot then aborts with
          # "Hash from header / Hash real ... Failed to load android image" before the kernel
          # is ever entered. This is NOT AVB: vbmeta is empty (flags=0x2 -> verification
          # disabled), so there is nothing to re-sign -- it is u-boot's own boot.img SHA1.
          # Without this step the image boots to u-boot, prints the T68M DTB, and dies.
          python3 tools/rk_boot_id.py check "$D/boot.img" || true
          python3 tools/rk_boot_id.py fix "$D/boot.img" -o "$D/boot.img.new"
          mv "$D/boot.img.new" "$D/boot.img"
          python3 tools/rk_boot_id.py check "$D/boot.img" | tee /tmp/bootid.txt
          grep -q MATCH /tmp/bootid.txt

      - name: Assemble SD image
        run: |
          set -euxo pipefail
          cd sd-fuse
          export RAW_SIZE_MB=${{ github.event.inputs.raw_size_mb }}
          sudo -E ./mk-sd-image.sh android14 2>&1 | tee /tmp/mk.log | tail -40
          ls -l out/
          IMG=$(ls out/*.img | head -1)
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          du -h "$IMG"

      - name: Compress
        run: |
          set -eux
          cd sd-fuse
          IMG=$(ls out/*.img | head -1)
          pigz -6 -p "$(nproc)" -c "$IMG" > "out/$(basename "$IMG").gz"
          ls -l out/
          sha256sum "out/$(basename "$IMG").gz" | tee out/SHA256SUMS

      - name: Evidence
        if: always()
        run: |
          {
            echo "## T68M SD image"
            echo '```'
            ls -l sd-fuse/out/ 2>/dev/null || true
            cat sd-fuse/out/SHA256SUMS 2>/dev/null || true
            echo '--- dtb feature matrix ---'
            cat /tmp/feat.txt 2>/dev/null || true
            echo '--- mk-sd-image tail ---'
            tail -30 /tmp/mk.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: t68m-android14-sd
          path: |
            sd-fuse/out/*.gz
            sd-fuse/out/SHA256SUMS
          compression-level: 0
          retention-days: 7
