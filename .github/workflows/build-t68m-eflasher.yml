name: build-t68m-eflasher

# Build an eMMC-flashing (eflasher) SD image for LYT T68M: boot the card, it flashes
# Android 14 into the board's eMMC instead of running from the card.
#
# Chain (FriendlyElec's own): mk-emmc-image.sh -> mk-sd-image.sh eflasher ->
# tools/fill_img_to_eflasher, which stuffs the OS image bundle into the eflasher
# card's FRIENDLYARM partition and leaves out/rk3568-eflasher-<os>-6.1-arm64-<date>.img
#
# WARNING: flashing eMMC destroys whatever is on it. On this T68M the eMMC holds the
# iNextOS boot partition (mmcblk0p1 /boot) -- back it up before using this image.
on:
  workflow_dispatch:
    inputs:
      src_url:
        description: android-14 partition bundle
        required: false
        default: https://downloads.friendlyelec.com/os-images/rk3568/images/android-14-images-20251222.tgz
      eflasher_url:
        description: eflasher template bundle
        required: false
        default: https://downloads.friendlyelec.com/os-images/rk3568/images/emmc-flasher-images-20260806.tgz
      dtb:
        description: dtb to inject
        required: false
        default: dist/rk3568-lyt-t68m-android.dtb
      autostart:
        description: autostart=yes flashes as soon as the card boots
        required: false
        default: "no"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # 产物命名 = 设备名 + 安卓版本，三条线统一前缀
      PKG: T68M-Android14
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex gzip pigz python3 parted dosfstools mtools \
            exfatprogs e2fsprogs android-sdk-libsparse-utils || true
          command -v simg2img || echo "simg2img missing"
          df -h /

      - name: Fetch both bundles
        run: |
          set -eux
          fetch() {
            for i in 1 2 3 4 5; do
              curl -L --fail --connect-timeout 20 --max-time 3600 \
                   --retry 5 --retry-delay 10 --retry-all-errors -o "$2" "$1" && return 0
              echo "retry $i for $1"; sleep 15
            done
            return 1
          }
          fetch "${{ github.event.inputs.src_url }}" images.tgz
          fetch "${{ github.event.inputs.eflasher_url }}" eflasher.tgz
          ls -l images.tgz eflasher.tgz
          sha256sum images.tgz eflasher.tgz

      - name: Unpack
        run: |
          set -eux
          mkdir -p parts efl
          tar xzf images.tgz -C parts
          tar xzf eflasher.tgz -C efl
          echo "--- android14 bundle ---"; find parts -maxdepth 2 -type f -printf '%10s %p\n' | sort -k2 | head -20
          echo "--- eflasher bundle ---"; find efl -maxdepth 2 -type f -printf '%10s %p\n' | sort -k2 | head -20
          echo "--- eflasher dir candidate ---"; find efl -maxdepth 3 -name parameter.txt

      - name: Clone sd-fuse
        run: |
          set -eux
          git clone --depth 1 https://github.com/friendlyarm/sd-fuse_rk3568.git sd-fuse
          if ! command -v simg2img >/dev/null; then
            sed -i 's/android-tools-fsutils/android-sdk-libsparse-utils/' sd-fuse/tools/util.sh
          fi
          namei -l sd-fuse/mk-emmc-image.sh || true

      - name: Stage android14 dir
        run: |
          set -eux
          D=sd-fuse/android14
          mkdir -p "$D"
          pick() { find parts -name "$1" -type f | head -1; }
          for f in parameter.txt config.cfg MiniLoaderAll.bin uboot.img dtbo.img \
                   vbmeta.img misc.img pcba_small_misc.img pcba_whole_misc.img \
                   baseparameter.img super.img; do
            src=$(pick "$f" || true)
            [ -n "$src" ] && cp "$src" "$D/$f" || echo "MISSING: $f"
          done
          for f in idbloader.img MiniLoaderAll.bin misc.img dtbo.img; do
            [ -f "$D/$f" ] || cp "sd-fuse/prebuilt/$f" "$D/$f"
          done
          src=$(pick boot.img); [ -n "$src" ] || { echo "no boot.img"; exit 1; }
          cp "$src" "$D/boot.orig.img"
          ls -l "$D"

      - name: Stage eflasher dir
        run: |
          set -eux
          EF=$(dirname "$(find efl -maxdepth 3 -name parameter.txt | head -1)")
          echo "eflasher template dir: $EF"
          du -sh "$EF"
          rm -rf sd-fuse/eflasher
          cp -a "$EF" sd-fuse/eflasher
          ls sd-fuse/eflasher | head -20

      - name: Inject T68M dtb into boot.img
        run: |
          set -eux
          D=sd-fuse/android14
          DTB="${{ github.event.inputs.dtb }}"
          python3 tools/dtb_features.py "$DTB" --base dist/rk3568-lyt-t68m-vendor.dtb | tee /tmp/feat.txt
          # NPU stays ENABLED, same as the vendor image for this board (LYT T68M rev0f). The 7.6 s panic
          # ("failed to get ack on domain 'npu'") was never a reason to disable it: this DTS
          # was missing vdd_npu(DCDC_REG4) regulator-always-on / -boot-on / -init-microvolt,
          # which the R5S baseline dtb has, so the NPU domain was unpowered when its iommu
          # attached to it at 7.6 s and the PMU idle-request never got its ack.
          npu_row=$(grep -E '^NPU[[:space:]]' /tmp/feat.txt || true)
          echo "gate: $npu_row"
          case "$npu_row" in
            *fail*) echo "FATAL: NPU must stay enabled (vendor parity); if it panics with"
                    echo "       'failed to get ack on domain npu', vdd_npu lost always-on"
                    exit 1 ;;
            *) echo "OK: NPU enabled, matching vendor (LYT T68M rev0f)" ;;
          esac
          # Patches that are only visible in the dtb bytes, not in the feature matrix.
          for s in 'rockchip,plane-mask' 'rockchip,primary-plane' 'regulator-always-on' 'no-1-8-v'; do
            grep -q -- "$s" "$DTB" || { echo "FATAL: dtb missing patch: $s"; exit 1; }
          done
          if grep -q -- 'sd-uhs-sdr50' "$DTB"; then
            echo "FATAL: sd-uhs-sdr50 still present (system disk must stay 3.3V)"; exit 1
          fi
          echo "gate: dtb patches OK (npu/iommu fail, vop plane-mask, always-on, no-1-8-v)"
          # 板级属性（HDMI 音频 / USB3.0 host / VOP 供电）不在 --only-ip 与 feature
          # matrix 的检查面内，且出错时内核零报错、只有用起来才发现。统一走这个脚本。
          python3 tools/assert_board_dtb.py "$DTB"
          # HDMI 音频必须是最新 dtb。mclk-fs 不是 128（dtsi 默认 256）或声卡名不是
          # rockchip,hdmi0 时，固件上板就是「有画面没声音」，而且内核日志零报错。
          python3 -c "
          import sys; sys.path.insert(0,'tools'); import dtb_diff as D
          N,_=D.load('$DTB'); h=N.get('/hdmi-sound') or {}
          m=h.get('simple-audio-card,mclk-fs')
          n=(h.get('simple-audio-card,name') or b'').rstrip(b'\x00')
          assert m==b'\x00\x00\x00\x80', 'mclk-fs=%r, need 128 -- dtb is stale' % (m,)
          assert n==b'rockchip,hdmi0', 'card name=%r, need rockchip,hdmi0 -- dtb is stale' % (n,)
          print('gate: HDMI audio OK (mclk-fs=128, name=rockchip,hdmi0)')
          "

          # 同 build-t68m-sd：必须走 make_lite_boot.py。47 条目时单槽只有 172,544 B，
          # 而本版 dtb 是 172,602 B（NPU 三属性 + vop plane-mask），boot-replace 会把
          # 第 19 个槽的开头踩掉。
          python3 tools/make_lite_boot.py "$D/boot.orig.img" "$DTB" "$D/boot.img" | tee /tmp/lite.txt
          grep -q 'entries=18' /tmp/lite.txt
          # 槽 size 恒等于 dtb 大小（build_rcs 按实际长度重排），没有固定容量可言，
          # 所以这里只校验布局真的算出来了，不再断言 headroom。
          grep -qE 'board slot\(s\), [0-9]+ B each' /tmp/lite.txt
          python3 tools/rsce_tool.py boot-list "$D/boot.img" | tee /tmp/list.txt | grep -E 'entries=|rk3568' | head -20
          grep -q 'rev0f\.dtb' /tmp/list.txt || { echo "FATAL: no rev0f slot (board is hwrev 0x0f)"; exit 1; }
          # 产物级校验：以上只证明输入 dtb 是对的，这里证明它**真的被写进了 boot.img**。
          # 逐字节查这份 dtb 是否完整出现在产物里，缺一个字节都算没注入。
          python3 -c "
          d=open('$D/boot.img','rb').read(); b=open('$DTB','rb').read()
          assert b in d, 'FATAL: boot.img 里找不到这份 dtb 的字节，注入没生效'
          print('gate: dtb in boot.img OK (%d B at offset %d)' % (len(b), d.index(b)))
          "

      - name: Serial console on ttyS2 (this board's DTB has no fiq-debugger)
        run: |
          set -euxo pipefail
          D=sd-fuse/android14
          # The board DTS is a Linux one: uart2 (0xfe660000) is driven by 8250 and
          # /chosen/stdout-path = "serial2:1500000n8" -- that is the console proven on this
          # board (COM3 @ 1500000).  There is no /fiq-debugger node, so the vendor's
          # "console=ttyFIQ0" has no driver: after earlycon the kernel prints nowhere and the
          # board looks dead while it boots.  Point the cmdline at ttyS2 instead.
          python3 tools/boot_cmdline.py show "$D/boot.img" || true
          python3 tools/boot_cmdline.py set "$D/boot.img" -o "$D/boot.cmd.img" --console ttyS2,1500000
          mv "$D/boot.cmd.img" "$D/boot.img"
          python3 tools/boot_cmdline.py show "$D/boot.img" | grep -q 'console=ttyS2,1500000'

      - name: Fix boot header SHA1 (u-boot CONFIG_ANDROID_BOOT_IMAGE_HASH)
        run: |
          set -euxo pipefail
          D=sd-fuse/android14
          # DTB swap changed the hashed content -> header id[20]@0x240 is stale -> u-boot
          # stops with "Failed to load android image". Not AVB (empty vbmeta, flags=0x2).
          python3 tools/rk_boot_id.py check "$D/boot.img" || true
          python3 tools/rk_boot_id.py fix "$D/boot.img" -o "$D/boot.img.new"
          mv "$D/boot.img.new" "$D/boot.img"
          python3 tools/rk_boot_id.py check "$D/boot.img" | tee /tmp/bootid.txt
          grep -q MATCH /tmp/bootid.txt

      - name: Build eflasher image
        run: |
          set -euxo pipefail
          cd sd-fuse
          export SDFUSE_NONINTERACTIVE=1
          export RAW_SIZE_MB=7800
          ARGS=""
          if [ "${{ github.event.inputs.autostart }}" = "yes" ]; then ARGS="autostart=yes"; fi
          sudo -E ./mk-emmc-image.sh android14 $ARGS 2>&1 | tee /tmp/mk.log | tail -40
          ls -l out/
          df -h /

      - name: Compress
        run: |
          set -euxo pipefail
          cd sd-fuse
          IMG=$(ls out/*eflasher*android14*.img 2>/dev/null | head -1)
          [ -n "$IMG" ] || IMG=$(ls out/*.img | head -1)
          echo "packing $IMG"
          OUT="out/$PKG-eflasher.img.gz"
          pigz -6 -p "$(nproc)" -c "$IMG" > "$OUT"
          ls -l "$OUT"
          ( cd out && sha256sum "$(basename "$OUT")" | tee SHA256SUMS )

      - name: Evidence
        if: always()
        run: |
          {
            echo "## T68M eflasher image"
            echo '```'
            ls -l sd-fuse/out/ 2>/dev/null || true
            cat sd-fuse/out/SHA256SUMS 2>/dev/null || true
            echo '--- dtb ---'
            cat /tmp/feat.txt 2>/dev/null || true
            echo '--- mk-emmc tail ---'
            tail -30 /tmp/mk.log 2>/dev/null || true
            echo '```'
            echo "**WARNING**: flashing eMMC wipes it. T68M eMMC holds iNextOS /boot (mmcblk0p1)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-eflasher
          path: |
            sd-fuse/out/*.gz
            sd-fuse/out/SHA256SUMS
          compression-level: 0
          retention-days: 7
